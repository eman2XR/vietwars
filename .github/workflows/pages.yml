name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: node --test
      - name: Check lessons and audio
        run: python3 scripts/check_lessons.py
      - name: Check scripts parse
        run: for f in web/js/*.js web/sw.js; do node --check "$f"; done
      - name: Stamp the offline cache with this commit
        run: sed -i "s/__BUILD__/${GITHUB_SHA::7}/" web/sw.js && grep -q "${GITHUB_SHA::7}" web/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
