<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Tiếng Việt">
  <meta name="theme-color" content="#fbf7f0">
  <title>Học tiếng Việt</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      background: #fbf7f0;
      color: #2b2420;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    main { text-align: center; padding: 24px; }
    h1 { font-size: 2.4rem; line-height: 1.4; margin: 0 0 8px; }
    p { margin: 0; color: #7a6d63; font-size: 1.1rem; }
    @media (prefers-color-scheme: dark) {
      body { background: #1c1917; color: #f3ede6; }
      p { color: #a89c92; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Học tiếng Việt</h1>
    <p>Northern Vietnamese, coming soon.</p>
  </main>
</body>
</html>
